<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>goav1 — realtime AV1 over WebRTC</title>
  <style>
    body { background: #111; color: #ddd; font-family: system-ui, sans-serif; margin: 2rem; }
    video { width: 100%; max-width: 960px; background: #000; border-radius: 8px; }
    #status { margin: 1rem 0; color: #8c8; }
  </style>
</head>
<body>
  <h1>goav1 — realtime AV1 push</h1>
  <div id="status">connecting…</div>
  <video id="video" autoplay playsinline muted></video>
  <script>
    const status = document.getElementById('status');
    const video = document.getElementById('video');
    const pc = new RTCPeerConnection();
    window.goav1PC = pc;
    window.goav1Video = video;
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.ontrack = (e) => { video.srcObject = e.streams[0]; };
    pc.onconnectionstatechange = () => { status.textContent = pc.connectionState; };
    (async () => {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await new Promise((resolve) => {
        if (pc.iceGatheringState === 'complete') return resolve();
        pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && resolve();
      });
      const resp = await fetch('/offer', { method: 'POST', body: pc.localDescription.sdp });
      if (!resp.ok) { status.textContent = 'offer failed: ' + resp.status; return; }
      await pc.setRemoteDescription({ type: 'answer', sdp: await resp.text() });
    })().catch((err) => {
      window.goav1Error = String(err && err.stack || err);
      status.textContent = 'failed';
    });
  </script>
</body>
</html>
