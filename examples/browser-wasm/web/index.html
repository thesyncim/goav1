<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goav1 wasm encoder</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5d6470;
    --line: #dde1e7; --accent: #2f6fde; --bad: #c2372b; --good: #1f8a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --panel: #1a1d23; --text: #e8eaee; --muted: #9aa1ad;
            --line: #2b3038; --accent: #6ea0ff; --bad: #ff7a6e; --good: #5fd08f; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end;
              background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  select, button { font: inherit; color: var(--text); background: var(--bg);
                   border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 800px) { .views { grid-template-columns: 1fr; } }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  figcaption { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  video, canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; object-fit: contain; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  #log { margin-top: 16px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted);
         white-space: pre-wrap; max-height: 160px; overflow: auto; }
  .bad { color: var(--bad); } .good { color: var(--good); }
</style>
</head>
<body>
<main>
  <h1>goav1 → WebAssembly realtime AV1 encoder</h1>
  <p class="sub">Camera → goav1 (TinyGo, wasm SIMD128, Web Worker) → AV1 bitstream → browser WebCodecs AV1 decoder → canvas. <a href="decode.html">Decoder demo</a></p>

  <div class="controls">
    <label>Source
      <select id="source"><option value="camera">Camera</option><option value="synthetic">Synthetic pattern</option></select></label>
    <label>Resolution
      <select id="res"><option value="320x180">320×180</option><option value="640x360" selected>640×360</option><option value="960x540">960×540</option><option value="1280x720">1280×720</option></select></label>
    <label>Bitrate
      <select id="bitrate"><option value="300000">300 kbps</option><option value="600000">600 kbps</option><option value="1000000" selected>1 Mbps</option><option value="2000000">2 Mbps</option><option value="4000000">4 Mbps</option></select></label>
    <label>Effort
      <select id="speed"><option value="-2" selected>-2 (fastest)</option><option value="-1">-1</option><option value="0">0 (default)</option><option value="2">2</option><option value="4">4 (slowest)</option></select></label>
    <label>Wasm build
      <select id="wasm"><option value="encoder-simd.wasm" selected>SIMD128</option><option value="encoder-simd-nobounds.wasm">SIMD128, no bounds checks</option><option value="encoder-scalar.wasm">scalar</option><option value="encoder-go.wasm">stock Go (js/wasm)</option></select></label>
    <button id="start" class="primary">Start</button>
    <button id="stop" disabled>Stop</button>
    <button id="key" disabled>Keyframe</button>
    <button id="bench">Benchmark</button>
  </div>

  <div class="views">
    <figure><figcaption><span>Source</span><span id="srcInfo"></span></figcaption>
      <video id="preview" muted playsinline></video><canvas id="synth" hidden></canvas></figure>
    <figure><figcaption><span>Decoded AV1 (WebCodecs)</span><span id="outInfo"></span></figcaption>
      <canvas id="out"></canvas></figure>
  </div>

  <div class="stats">
    <div class="stat"><b id="sEnc">–</b><span>encode ms / frame</span></div>
    <div class="stat"><b id="sFps">–</b><span>encoded fps</span></div>
    <div class="stat"><b id="sKbps">–</b><span>kbps</span></div>
    <div class="stat"><b id="sQ">–</b><span>qindex</span></div>
    <div class="stat"><b id="sLat">–</b><span>capture→display ms</span></div>
    <div class="stat"><b id="sDrop">–</b><span>frames dropped</span></div>
  </div>
  <div id="log"></div>
</main>
<script src="app.js"></script>
</body>
</html>
