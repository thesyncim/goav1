name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, go${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: go env
        run: go env
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    name: test (${{ matrix.os }}, go${{ matrix.go }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        shell: bash
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: go test
        run: go test -count=1 ./...

  race:
    name: race (ubuntu)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: go test -race
        run: go test -race -count=1 ./...

  alloc:
    name: alloc regression
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: make alloc
        run: make alloc
      - name: compiler reports
        run: make compiler-reports

  fuzz-smoke:
    name: fuzz smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: make fuzz-smoke
        run: make fuzz-smoke
        env:
          FUZZTIME: 50000x

  cli-smoke:
    name: cli smoke (aom-go-dec)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: build aom-go-dec
        run: make build-cmd
      - name: cli smoke test
        run: go test ./cmd/aom-go-dec -count=1
