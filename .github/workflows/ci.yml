name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: build (${{ matrix.os }}, go${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: go env
        run: go env
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    name: test (${{ matrix.os }}, go${{ matrix.go }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        shell: bash
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: go test
        run: go test -count=1 -timeout 30m ./...

  simd-arm64:
    name: SIMD (linux/arm64, Go 1.27.x)
    needs: build
    runs-on: ubuntu-24.04-arm
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: verify official toolchain and native arm64
        run: |
          go version
          test "$(go env GOARCH)" = arm64
          test "$(uname -m)" = aarch64
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        shell: bash
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: build with native SIMD
        run: go build ./...
      - name: test with native SIMD
        run: go test -count=1 -timeout 30m ./...
      - name: focused SIMD race and checkptr tests
        run: >-
          go test -race -count=1 -timeout 30m
          ./internal/av1/dsp
          ./internal/av1/cdef
          ./internal/av1/loopfilter
          ./internal/av1/prediction
          ./internal/av1/restoration
          ./internal/av1/motion
          ./internal/av1/transform
          ./internal/av1/quantize
          ./internal/av1/decoder
      - name: strict fast decoder parity with native SIMD
        run: make dryrun-fast
      - name: strict profile decoder parity with native SIMD
        run: make dryrun-profiles

  linux-386-bounds:
    name: linux/386 bounds and parser regressions
    needs: build
    runs-on: ubuntu-latest
    env:
      GOARCH: '386'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: go build (linux/386)
        run: go build ./...
      - name: IVF and public plane-bound regressions
        run: >-
          go test -count=1 -timeout 180s
          -run '^(TestReaderAtDecoderPayloadSource.*|FuzzReaderAtDecoderPayloadSourceMatchesSliceIterator|FuzzPublicSimpleDecoderIVF|TestPublicEncodeRejectsStrideWhosePlaneLengthOverflows|TestPublicEncodeAcceptsMinimalAndPaddedStrides)$'
          .
      - name: encoder plane-length boundaries
        run: >-
          go test -count=1 -timeout 180s
          -run '^(TestCheckedPlaneLengthBoundaries|TestMonochromeRenderValidatorsRejectOverflowingStride|TestMonochromeRenderValidatorsAcceptSingleRow|TestColor16ValidatorChecksChromaPlaneLength|TestColor16RenderValidatorAcceptsSingleRowSubsampledGeometry)$'
          ./internal/av1/encoder

  race:
    name: race (${{ matrix.shard }})
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - public
          - encoder
          - testvector
          - decode
          - kernels-a
          - kernels-b
          - syntax-transport
          - tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: audit race shard coverage
        run: bash .github/scripts/race-ci.sh audit
      - name: go test -race
        run: bash .github/scripts/race-ci.sh run "${{ matrix.shard }}"

  alloc:
    name: alloc regression
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: make alloc
        run: make alloc
      - name: compiler reports
        run: make compiler-reports

  fuzz-smoke:
    name: fuzz smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: make fuzz-smoke
        run: make fuzz-smoke
        env:
          FUZZTIME: 50000x

  webrtc-reference:
    name: webrtc reference decoders (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: 1
            name: controller settings
          - shard: 2
            name: scalability catalogue
          - shard: 3
            name: encoder format reference tests
          - shard: 4
            name: encoder internal and RTP controls
          - shard: 5
            name: direct L1 playback
          - shard: 6
            name: shared SVC L2T1 playback
          - shard: 7
            name: shared SVC L2T2 playback
          - shard: 8
            name: encoder control reference tests
          - shard: 9
            name: encoder non-reference tests
          - shard: 10
            name: shared-reference SVC L2 modes
          - shard: 11
            name: shared-reference SVC L3 modes
          - shard: 12
            name: public remainder
          - shard: 13
            name: simulcast S2T1 and S2T2 playback
          - shard: 14
            name: simulcast S2T3 playback
          - shard: 15
            name: shared SVC L2T3 playback
          - shard: 16
            name: shared SVC L3T1 playback
          - shard: 17
            name: shared SVC L3T2 playback
          - shard: 18
            name: shared SVC L3T3 playback
          - shard: 19
            name: simulcast S3T1 and S3T2 playback
          - shard: 20
            name: simulcast S3T3 playback
          - shard: 21
            name: browser playback reconnect
          - shard: 22
            name: direct browser playback soak
          - shard: 23
            name: shared SVC browser playback soak
          - shard: 24
            name: simulcast browser playback soak
          - shard: 25
            name: direct browser control churn
          - shard: 26
            name: shared SVC browser control churn
          - shard: 27
            name: simulcast browser control churn
          - shard: 28
            name: browser feedback controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: install reference decoders
        if: ${{ matrix.shard <= 4 || (matrix.shard >= 8 && matrix.shard <= 12) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y aom-tools dav1d
          command -v aomdec
          command -v dav1d
      - name: WebRTC production shard ${{ matrix.shard }}
        run: make webrtc-production-ci WEBRTC_PRODUCTION_CI_SHARD=${{ matrix.shard }}

  cli-smoke:
    name: cli smoke (aom-go-dec)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: build aom-go-dec
        run: make build-cmd
      - name: cli smoke test
        run: go test ./cmd/aom-go-dec -count=1
