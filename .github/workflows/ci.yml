name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: build (${{ matrix.os }}, go${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: go env
        run: go env
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    name: test (${{ matrix.os }}, go${{ matrix.go }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        shell: bash
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: go test (Windows, streaming output)
        if: ${{ matrix.os == 'windows-latest' }}
        run: go test -json -count=1 -timeout 30m ./...
      - name: go test
        if: ${{ matrix.os != 'windows-latest' }}
        run: go test -count=1 -timeout 30m ./...

  simd-arm64:
    name: SIMD (linux/arm64, Go 1.27.x)
    needs: build
    runs-on: ubuntu-24.04-arm
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: verify official toolchain and native arm64
        run: |
          go version
          test "$(go env GOARCH)" = arm64
          test "$(uname -m)" = aarch64
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        shell: bash
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: build with native SIMD
        run: go build ./...
      - name: compiler reports with native SIMD
        run: make compiler-reports
      - name: test with native SIMD
        run: go test -count=1 -timeout 30m ./...
      # The race shards already run these packages under -race on the
      # generic kernels; here the SIMD kernels need checkptr, which -race
      # would enable at about five times the cost.
      - name: focused SIMD checkptr tests
        run: >-
          go test -count=1 -timeout 45m -gcflags=all=-d=checkptr
          ./internal/av1/dsp
          ./internal/av1/cdef
          ./internal/av1/loopfilter
          ./internal/av1/prediction
          ./internal/av1/restoration
          ./internal/av1/motion
          ./internal/av1/transform
          ./internal/av1/quantize
          ./internal/av1/decoder
          ./internal/av1/encoder
      - name: exact-window SIMD pointer regressions
        run: >-
          go test -race -count=1 -gcflags=all=-d=checkptr=2
          -run '^TestSAD8x8x4SIMD(ExactMinimumSlice|ByteExact|Extremes)$'
          ./internal/av1/encoder
      - name: strict fast decoder parity with native SIMD
        run: make dryrun-fast
      - name: strict profile decoder parity with native SIMD
        run: make dryrun-profiles

  simd-amd64:
    name: SIMD (linux/amd64 AVX2, Go 1.27.x)
    needs: build
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: verify official toolchain and native amd64 AVX2
        run: |
          go version
          test "$(go env GOARCH)" = amd64
          test "$(uname -m)" = x86_64
          grep -q -w avx2 /proc/cpuinfo
      - name: four-lane Go SIMD parity and live dispatch
        run: >-
          go test -count=1 -v
          -run '^(TestNativeDCTLanes4.*|TestAMD64DCTLanes4Dispatch|TestAMD64FusedITXDispatch|TestInverseAdd.*MatchesStagedPath|TestSIMDAMD64MatchesArchsimdQueries|TestDetectedMatchesArch)$'
          ./internal/av1/transform ./internal/av1/dsp/cpu
      - name: 8-bit motion compensation AVX2 parity and live dispatch
        run: >-
          go test -count=1 -v
          -run '^TestAMD64MC8.*$'
          ./internal/av1/motion
      - name: film grain AVX2 parity and live dispatch
        run: >-
          go test -count=1 -v
          -run '^(TestAMD64FilmGrainU8.*|TestApplyRowsU8MatchPerSampleReference)$'
          ./internal/av1/filmgrain
      - name: loop filter AVX2 parity and live dispatch
        run: >-
          go test -count=1 -v
          -run '^(TestAMD64LPFSB.*|TestFilterSB8.*|TestFilterSB16.*)$'
          ./internal/av1/loopfilter
      - name: CDEF AVX2 parity and live dispatch
        run: >-
          go test -count=1 -v
          -run '^(TestAMD64CDEF.*|TestFilterFrameBlocksU8ByteInterior.*|TestFindDirection.*|TestFilterBlockU8SIMD.*|TestFilterBlockSIMD.*)$'
          ./internal/av1/cdef
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        shell: bash
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: build with native SIMD
        run: go build ./...
      - name: compiler reports with native SIMD
        run: make compiler-reports
      - name: vet with native SIMD
        run: go vet ./...
      - name: test with native SIMD
        run: go test -count=1 -timeout 30m ./...
      # The race shards already run these packages under -race on the
      # generic kernels; here the SIMD kernels need checkptr, which -race
      # would enable at about five times the cost.
      - name: focused SIMD checkptr tests
        run: >-
          go test -count=1 -timeout 45m -gcflags=all=-d=checkptr
          ./internal/av1/dsp
          ./internal/av1/cdef
          ./internal/av1/loopfilter
          ./internal/av1/prediction
          ./internal/av1/restoration
          ./internal/av1/motion
          ./internal/av1/transform
          ./internal/av1/quantize
          ./internal/av1/decoder
          ./internal/av1/encoder
      - name: strict fast decoder parity with native SIMD
        run: make dryrun-fast
      - name: strict profile decoder parity with native SIMD
        run: make dryrun-profiles

  linux-386-bounds:
    name: linux/386 bounds and parser regressions
    needs: build
    runs-on: ubuntu-latest
    env:
      GOARCH: '386'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: go build (linux/386)
        run: go build ./...
      - name: IVF and public plane-bound regressions
        run: >-
          go test -count=1 -timeout 180s
          -run '^(TestReaderAtDecoderPayloadSource.*|FuzzReaderAtDecoderPayloadSourceMatchesSliceIterator|FuzzPublicSimpleDecoderIVF|TestPublicEncodeRejectsStrideWhosePlaneLengthOverflows|TestPublicEncodeAcceptsMinimalAndPaddedStrides)$'
          .
      - name: encoder plane-length boundaries
        run: >-
          go test -count=1 -timeout 180s
          -run '^(TestCheckedPlaneLengthBoundaries|TestMonochromeRenderValidatorsRejectOverflowingStride|TestMonochromeRenderValidatorsAcceptSingleRow|TestColor16ValidatorChecksChromaPlaneLength|TestColor16RenderValidatorAcceptsSingleRowSubsampledGeometry)$'
          ./internal/av1/encoder

  race:
    name: race (${{ matrix.shard }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard:
          - public-0
          - public-1
          - public-2
          - public-3
          - encoder-0
          - encoder-1
          - encoder-2
          - testvector
          - decode
          - kernels-a
          - kernels-b
          - syntax-transport
          - tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: audit race shard coverage
        run: bash .github/scripts/race-ci.sh audit
      - name: audit split race test coverage
        if: ${{ matrix.shard == 'public-0' }}
        run: bash .github/scripts/race-ci.sh audit-split
      - name: go test -race
        run: bash .github/scripts/race-ci.sh run "${{ matrix.shard }}"

  alloc:
    name: alloc regression
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: make alloc
        run: make alloc
      - name: compiler reports
        run: make compiler-reports

  fuzz-smoke:
    name: fuzz smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: make fuzz-smoke
        run: make fuzz-smoke
        env:
          FUZZTIME: 50000x

  webrtc-reference:
    name: webrtc ${{ matrix.name }}
    needs: build
    # Each job runs several make webrtc-production-ci shards back to back,
    # balanced by their test time (about 6-8 minutes per job), so the matrix
    # pays runner setup six times instead of 43 and is not throttled by the
    # concurrent-job limit.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: reference decoders A
            shards: '1 2 3 4 11 39 41'
            reference: true
          - name: reference decoders B
            shards: '8 9 10 12 38 42 43'
            reference: true
          - name: browser A
            shards: '6 18 21 25 26 30 40'
            reference: false
          - name: browser B
            shards: '7 13 15 16 17 23 29 34'
            reference: false
          - name: browser C
            shards: '5 14 24 27 28 33 36'
            reference: false
          - name: browser D
            shards: '19 20 22 31 32 35 37'
            reference: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: install reference decoders
        if: ${{ matrix.reference }}
        run: |
          sudo apt-get update
          sudo apt-get install -y aom-tools dav1d
          command -v aomdec
          command -v dav1d
      - name: WebRTC production shards ${{ matrix.shards }}
        run: |
          failed=''
          for shard in ${{ matrix.shards }}; do
            echo "::group::WebRTC production shard $shard"
            if ! make webrtc-production-ci WEBRTC_PRODUCTION_CI_SHARD=$shard; then
              failed="$failed $shard"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::WebRTC production shards failed:$failed"
            exit 1
          fi

  cli-smoke:
    name: cli smoke (aom-go-dec)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: cache libaom example fixtures
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-example-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-example-
      - name: fetch example fixture
        run: bash .github/scripts/fetch-libaom-ci-fixtures.sh
      - name: build aom-go-dec
        run: make build-cmd
      - name: cli smoke test
        run: go test ./cmd/aom-go-dec -count=1
