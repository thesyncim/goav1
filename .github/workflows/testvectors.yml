name: testvectors

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    name: fast test vectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: cache libaom vectors
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-fast-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-fast-
      - name: make testvectors-fast
        run: make testvectors-fast

  dryrun-fast:
    name: framework dry-run (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: cache libaom vectors
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-fast-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-fast-
      - name: fast framework dry-run (regression gate)
        env:
          GOAV1_FAST_LIBAOM_FRAMEWORK_DRYRUN: '1'
        run: |
          set -o pipefail
          # One sub-vector is known to fail; the remaining seven MUST keep passing.
          # Capture the full verbose log, then assert that the documented passing
          # set still passes. The job fails when any known-passing vector regresses.
          go test -tags goav1_oracle ./internal/av1/testvector \
            -run 'TestLibaomFastFrameWorkDryRun' \
            -count=1 -timeout 600s -v 2>&1 | tee dryrun.log || true

          expected_passes="libaom_av1_8-bit_quantizer_00 libaom_av1_8-bit_16x16_size libaom_av1_8-bit_all-intra libaom_av1_8-bit_cdf_update libaom_av1_8-bit_mv libaom_av1_8-bit_mfmv libaom_av1_8-bit_monochrome"
          known_failing="libaom_av1_8-bit_intra-only_intrabc_extreme_dv"

          status=0
          for vector in $expected_passes; do
            if grep -qE -- "--- PASS: TestLibaomFastFrameWorkDryRun/${vector}" dryrun.log; then
              echo "ok: ${vector}"
            else
              echo "REGRESSION: ${vector} did not pass" >&2
              status=1
            fi
          done

          echo "::group::known in-progress vectors (informational, not gating)"
          for vector in $known_failing; do
            if grep -qE -- "--- PASS: TestLibaomFastFrameWorkDryRun/${vector}" dryrun.log; then
              echo "note: ${vector} now PASSES (update the workflow gate to require it)"
            else
              echo "info: ${vector} still failing (known)"
            fi
          done
          echo "::endgroup::"

          exit "$status"
      - name: strict-md5 informational sweep
        if: always()
        env:
          GOAV1_FAST_LIBAOM_FRAMEWORK_DRYRUN: '1'
          GOAV1_STRICT_MD5: '1'
        run: |
          # Strict MD5 mode upgrades the lenient first-frame check to every
          # frame. Only `16x16_size` currently passes this stricter gate;
          # the rest are tracked for diagnostic purposes and this step never
          # fails the job. The summary is wrapped in a collapsible group so
          # the broader run log stays readable.
          echo "::group::strict-md5 (informational, not gating)"
          go test -tags goav1_oracle ./internal/av1/testvector \
            -run 'TestLibaomFastFrameWorkDryRun' \
            -count=1 -timeout 600s -v 2>&1 | tee dryrun-strict.log || true
          echo "--- per-vector summary (strict-md5) ---"
          grep -E "^\s*--- (PASS|FAIL): TestLibaomFastFrameWorkDryRun/" dryrun-strict.log || true
          echo "::endgroup::"
      - name: upload dry-run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-dryrun-log
          path: |
            dryrun.log
            dryrun-strict.log
          if-no-files-found: ignore
          retention-days: 14
