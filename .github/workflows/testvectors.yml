name: testvectors

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    name: fast test vectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: cache libaom vectors
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-fast-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-fast-
      - name: make testvectors-fast
        run: make testvectors-fast

  dryrun-fast:
    name: framework dry-run (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: cache libaom vectors
        uses: actions/cache@v4
        with:
          path: internal/av1/testdata/libaom
          key: libaom-fast-${{ hashFiles('internal/av1/testvector/libaom_manifest.go') }}
          restore-keys: |
            libaom-fast-
      - name: fast framework dry-run (regression gate)
        env:
          GOAV1_FAST_LIBAOM_FRAMEWORK_DRYRUN: '1'
          GOAV1_STRICT_MD5: '1'
        run: |
          set -o pipefail
          # All eight fast-suite sub-vectors MUST pass strict per-frame MD5.
          go test -tags goav1_oracle ./internal/av1/testvector \
            -run 'TestLibaomFastFrameWorkDryRun' \
            -count=1 -timeout 600s -v 2>&1 | tee dryrun.log
      - name: upload dry-run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-dryrun-log
          path: |
            dryrun.log
          if-no-files-found: ignore
          retention-days: 14
